; Versions are pinned exactly. This firmware targets arduino-esp32 2.0.17
; (shipped by platform 6.12.0) and relies on its behaviour in places —
; WiFi.setHostname() requires STA mode to already be active, and
; esp_task_wdt_init() takes (timeout, panic). Both changed in core 3.x.
; ArduinoJson is held at 7.x while the code still uses the v6 API
; (StaticJsonDocument, createNestedObject, containsKey), which v7 deprecates
; and v8 will remove. Re-pin deliberately, not incidentally.

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  mathieucarbou/ESPAsyncWebServer@3.6.0
  mathieucarbou/AsyncTCP@3.3.2
  alanswx/ESPAsyncWiFiManager@0.31
  ropg/ezTime@0.8.3
monitor_speed = 115200
upload_protocol = esptool

[env:ota]
extends = env:esp32dev
upload_protocol = espota
; Can also be badminton-timer.local now that the hostname is advertised
upload_port = 192.168.123.142
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
